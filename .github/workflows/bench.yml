# Tests and benchmarks on GitHub's runners: real x86_64 and arm64 hardware,
# where the vendored amd64 SHA-256 routines (SHA-NI, AVX2) run natively, and
# a measure of libsodium's Argon2id lead over x/crypto on each, which only
# benching both builds side by side gives. Run by hand; a release benches its
# own binaries (release.yml). The CSV rows are benchmarks/scores.csv's; add
# them there by hand.
name: test and bench

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # tags, so the build knows its version
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: libsodium
        run: sudo apt-get update && sudo apt-get install -y libsodium-dev

      - name: machine
        run: |
          { echo '### ${{ matrix.runner }}'; echo '```'; lscpu | grep -E 'Model name|^CPU\(s\)|Flags' | cut -c1-400; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      # Everything below writes outside the checkout, so the builds are not
      # "+dirty" in their version.
      - name: SHA-256 routines
        run: |
          go test -count=1 -v -run 'TestEachRoutine|TestMatchesStdlib|TestFaster' ./internal/sha256iter | tee "$RUNNER_TEMP/sha.txt"
          { echo '```'; grep -E -- '---|accelerated|M/s|cannot' "$RUNNER_TEMP/sha.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: test
        run: |
          go vet ./...
          go test -count=1 ./...
          go test -count=1 -tags wickset_testalgs ./...
          go test -count=1 -short -tags libsodium ./...
          CGO_ENABLED=0 go test -count=1 -short ./...

      - name: bench
        run: |
          go build -o "$RUNNER_TEMP/wickset-go" ./cmd/wickset
          go build -tags libsodium -o "$RUNNER_TEMP/wickset-sodium" ./cmd/wickset
          cd "$RUNNER_TEMP"
          ./wickset-go --version
          {
            for a in 1 2 3 4; do ./wickset-go --cpu bench --csv --alg "$a"; done
            for a in 1 2; do ./wickset-sodium --cpu bench --csv --alg "$a"; done
          } | awk 'NR==1 || !/^date,/' > scores.csv
          { echo '```csv'; cat scores.csv; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: scores-${{ matrix.runner }}
          path: ${{ runner.temp }}/scores.csv
